# DiceGo 站点配置：放到 /etc/nginx/conf.d/dicego.conf
# 前端是纯静态站点；/api /auth /system /resource 走后端，/ws 需要 WebSocket 升级。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dicego_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    root /opt/dicego/www;
    index index.html;
    client_max_body_size 20m;

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 后端监控端点不对外暴露
    location ~ ^/actuator {
        return 403;
    }

    # 后端接口 + SSE 消息盒 + WebSocket
    location ~ ^/(api|auth|system|resource|ws)/ {
        proxy_pass http://dicego_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE / WebSocket 长连接不能被代理提前断开
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 前端路由（history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
