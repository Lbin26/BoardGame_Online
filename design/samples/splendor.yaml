schemaVersion: 1
meta:
  key: splendor
  name: 璀璨宝石
  players: { min: 2, max: 4 }
  durationMin: 30
  targetWeight: 2
  zone: card
mechanisms:
  - engine-building
  - set-collection
components:
  resources:
    - key: gem
      name: 宝石（五色合并抽象：白/蓝/绿/红/黑，真实规则按色匹配）
    - key: bonus
      name: 发展卡永久加成（引擎，真实为对应色宝石折扣）
  decks:
    - key: level1
      name: 一级发展卡（40 张）
      cards:
        - { key: l1a, count: 20, cost: { gem: 3 }, gain: { bonus: 1 }, vp: 0 }
        - { key: l1b, count: 16, cost: { gem: 4 }, gain: { bonus: 1 }, vp: 0 }
        - { key: l1c, count: 4, cost: { gem: 5 }, gain: { bonus: 1 }, vp: 1 }
    - key: level2
      name: 二级发展卡（30 张）
      cards:
        - { key: l2a, count: 20, cost: { gem: 6 }, gain: { bonus: 1 }, vp: 2 }
        - { key: l2b, count: 10, cost: { gem: 8 }, gain: { bonus: 1 }, vp: 3 }
    - key: level3
      name: 三级发展卡（20 张）
      cards:
        - { key: l3a, count: 12, cost: { gem: 10 }, gain: { bonus: 1 }, vp: 4 }
        - { key: l3b, count: 8, cost: { gem: 14 }, gain: { bonus: 1 }, vp: 5 }
turnStructure:
  phases:
    - key: chooseAction
      name: 执行一个行动（四选一）
      summary: 拿 3 枚异色宝石；或拿 2 枚同色宝石（该色供给≥4）；或预留 1 张发展卡并拿 1 黄金（百搭）；或购买 1 张发展卡（支付费用减去永久加成）。
    - key: nobleVisit
      name: 贵族拜访
      summary: 若永久加成满足某贵族需求（两色各 4），自动获得该贵族（3 VP），不耗行动，每回合至多 1 个。贵族数量=玩家数+1。
    - key: discard
      name: 整理手牌
      summary: 回合末宝石标记超过 10 须弃至 10。
subsystems:
  economy:
    resources: [gem, bonus]
    initial: { gem: 0, bonus: 0 }
    perTurn:
      - { resource: gem, produce: 3, consume: 0 }
    actions:
      - { key: buyLevel3, cost: { gem: 7, bonus: 4 }, gain: { bonus: 1 }, vp: 4 }
      - { key: buyLevel2, cost: { gem: 5, bonus: 2 }, gain: { bonus: 1 }, vp: 2 }
      - { key: buyLevel1, cost: { gem: 4 }, gain: { bonus: 1 }, vp: 0 }
    stallK: 3
  scoring:
    endTrigger: 任一玩家达到 15 VP，完成当前轮后终局，最高 VP 者胜。
    vpSources:
      - key: cards
        name: 发展卡 VP
        description: 每张发展卡 0~5 VP（一级 0~1、二级 1~3、三级 3~5）。
      - key: nobles
        name: 贵族 VP
        description: 每个贵族 3 VP，加成达标自动拜访。
analysis:
  whyFun: 极简行动（四选一）下的引擎竞速。买卡给永久加成（折扣）+VP，前期投资引擎、后期加速兑现，"引擎成型回合数"是核心策略变量。宝石五色匹配 + 贵族成套收集制造互动（抢卡/卡色）。15 VP 达标即终局压缩滚雪球，落后者仍有追赶窗口。
  remixable:
    - 永久加成折扣引擎——买卡降低后续购买成本，可借鉴到任何引擎构建游戏（加成不消耗、单调累积）。
    - 三色层级卡（费用/VP 递增）——低费低 VP 垫引擎、高费高 VP 兑现，可借鉴到科技树/升级轨。
    - 贵族成套收集（两色各 4 自动触发）——不耗行动的被动成套奖励，可借鉴到 set-collection 的"达标即得"。
    - 预留 + 黄金百搭——隐藏意图 + 万能资源，可借鉴到手牌管理/轮抽的干扰与灵活性。
    - 15 VP 达标终局压缩——固定目标触发终局而非固定回合，抑制滚雪球，可借鉴到引擎游戏终局设计。
    - 宝石手牌上限 10——囤积约束，迫使消费，可借鉴到资源管理的库存压力。
  pitfalls: 经济模型为静态流量近似——真实 bonus 是永久折扣不消耗，此处抽象为高级卡的引擎门槛资源（cost bonus）以在工具包静态模型中表达"引擎成型后才能高效购买高级卡"；精确折扣加速需更丰富模型。五色匹配 puzzle 被合并为单一 gem，颜色博弈未 captured。贵族/预留/黄金未在 economy 展开。卡牌费用为约值（真实按色组合）。
  sources:
    - title: 自身知识推理（离线，无实时检索；2~4 人/30 分/15 VP 终局、三级卡 40/30/20 张、五色宝石+黄金百搭、贵族两色各 4 得 3 VP、手牌上限 10 为通行规则；单卡费用/VP 分布与 economy 抽象参数为约值/推理）
  confidence: medium