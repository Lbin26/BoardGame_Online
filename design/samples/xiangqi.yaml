schemaVersion: 1
meta:
  key: xiangqi
  name: 中国象棋
  players: { min: 2, max: 2 }
  durationMin: 40
  targetWeight: 3
  zone: abstract
mechanisms:
  - abstract-chess
  - grid-movement
components: {}
turnStructure:
  phases:
    - key: move
      name: 走子
      summary: 红先黑后，轮流走一步。棋子落在 9×10 交叉点（90 点）上，非格内。每子有固定走法与阻塞规则。
    - key: capture
      name: 吃子
      summary: 落点为敌子即吃掉（无吃过路兵、无王车易位）。炮吃子须隔且仅隔一个"炮架"。
    - key: check
      name: 将军与应将
      summary: 攻击对方帅/将即将军，被将方必须应将；无法应将即被将死判负。
subsystems:
  scoring:
    endTrigger: 将死对方帅/将，或对方无子可走（困毙），或对方认输/超时。
    vpSources:
      - key: win
        name: 胜负判定
        description: 二元胜负，无积分。将死或困毙对方即胜。与中国象棋判例一致——困毙（stalemate）判负，不同于国际象棋的判和。长将/长捉禁手，须变着否则判负。
analysis:
  whyFun: 完全信息下的纯战术计算对抗。子力价值高度不对称（车≈9、炮≈4.5、马≈4、兵过河后升值），且每子有独特阻塞规则（蹩马腿、塞象眼、炮架），让同一棋盘产生极丰富的局部战术。"飞将"规则（两将不得照面）把防守子力变成进攻武器，是独有的空间张力。
  remixable:
    - 子力价值不对称 + 每子独特移动/阻塞规则——可借鉴到任何网格对抗游戏，制造"子力配合"而非"子力堆叠"的深度。
    - 炮的"隔子吃子"机制——一个需要第三方（炮架）才能生效的攻击，天然产生位置博弈与临时联盟。
    - 区域限制（帅/士不出九宫、象不过河）——用移动禁区制造防守弱点与进攻方向，可借鉴到区域控制游戏。
    - 困毙判负（而非判和）——消除"逼和"逃生通道，让落后方不能靠僵持谋和，加快终局。
    - 兵过河升值（不可后退、过河后可横走）——单向推进 + 条件升级，可借鉴到进度轨/推进类机制。
  pitfalls: 先手（红）有微弱优势但无贴目补偿，高水平对局和棋率高；子力价值不对称若移植到随机抽取系统会放大运气；困毙判负对新手不直观（与国际象棋惯例冲突），教学需强调。
  sources:
    - title: 自身知识推理（离线，无实时检索；中国象棋规则为经典稳定结构，关键数值如 9×10 棋盘、32 子、九宫、河界、飞将、困毙判负均为通行规则）
  confidence: medium