schemaVersion: 1
meta:
  key: avalon
  name: 阿瓦隆
  players: { min: 5, max: 10 }
  durationMin: 30
  targetWeight: 2
  zone: narrative
mechanisms:
  - hidden-roles
  - logical-deduction
  - voting
components: {}
turnStructure:
  phases:
    - key: team
      name: 组队
      summary: 本轮领袖按当前任务所需人数提名队员（可含自己），全员公开讨论。任务人数随玩家数与任务序号变化（如 5 人局为 2/3/2/3/3）。
    - key: vote
      name: 投票
      summary: 全员同时公开投赞成/反对，过半赞成则组队通过进入任务；否则领袖顺延至下家。同一任务连续 5 次组队被否决，邪恶阵营直接获胜。
    - key: mission
      name: 任务
      summary: 入选队员秘密各出一张成功/失败牌。善良必须出成功；邪恶可出成功（伪装）或失败。≥1 张失败则任务失败（7+ 人局的第 4 任务需 2 张失败）。只公布失败张数，不公布谁出的。
    - key: assassinate
      name: 刺杀
      summary: 若善良阵营完成 3 个任务，邪恶阵营刺客公开指认一名善良玩家为梅林；指中则邪恶反败为胜，指错则善良获胜。
subsystems:
  scoring:
    endTrigger: 3 任务成功（善良胜，进入刺杀）或 3 任务失败（邪恶胜）或连续 5 次组队否决（邪恶胜）或梅林被刺中（邪恶胜）。
    vpSources:
      - key: missions
        name: 任务成败
        description: 5 个任务中先赢 3 个的一方获胜；善良获胜后须梅林未被刺中才算最终胜利。无积分，二元阵营胜负。
analysis:
  whyFun: 隐藏身份下的社交推理。善良方靠投票模式与任务失败张数推断谁是邪恶；邪恶方伪装善良、误导投票、混入成功牌。梅林知道所有邪恶（除莫德雷德）却不能暴露——暴露即被刺，制造"知道却不能说"的信号博弈张力。信息分层（梅林/派西维尔/莫甘娜/莫德雷德/奥伯伦）让推理有层次而非单纯猜身份。
  remixable:
    - 分层隐藏信息——梅林知邪恶、派西维尔知梅林（但莫甘娜伪装梅林）、莫德雷德对梅林隐身、奥伯伦对邪恶同伴隐身。可借鉴到任何隐藏身份游戏的信息分层设计（谁知道谁、谁伪装谁）。
    - 知情者暴露惩罚（知道却不能说的张力）——梅林被刺即输，给知情者加暴露成本，制造信号博弈（如何在不暴露的前提下引导）。可借鉴到任何有知情者的机制。
    - 投票否决累积惩罚——连续 5 次否决邪恶直接胜，防止善良方无限拖延，给推理加时间压力。可借鉴到投票/谈判机制的僵局破解。
    - 任务失败牌匿名——只公布失败张数不公布谁，邪恶混成功牌伪装。可借鉴到匿名贡献/搭便车/公共品博弈。
    - 刺杀反败为胜——给即将失败的邪恶方一个终局翻盘窗口，维持落后者参与感（缓解国王制造/downtime）。可借鉴到任何阵营对抗的终局设计。
    - 善良必须出成功（邪恶可选）——不对称行动约束制造推理线索（失败牌必来自邪恶），可借鉴到隐藏身份的"行为指纹"。
  pitfalls: 人数缩放复杂——不同人数（5~10）的角色配置、任务人数、第 4 任务失败阈值均不同，须按人数查表（本档案不展开各人数配置）。梅林体验两极（被刺即输，压力大）；新手易暴露身份；推理质量依赖玩家水平，离线/新手局可能退化为乱猜。无经济/冲突子系统（纯社交推理，数值模拟不适用，平衡靠身份配置与任务结构）。
  sources:
    - title: 自身知识推理（离线，无实时检索；5~10 人/30 分、5 任务、组队→投票→任务→刺杀流程、梅林/派西维尔/莫甘娜/莫德雷德/奥伯伦/刺客信息结构、连续 5 否决邪恶胜、善良必出成功、7+ 人第 4 任务需 2 失败均为通行规则；各人数任务人数/角色配置为约值，本档案以 5 人局任务人数 2/3/2/3/3 为例）
  confidence: medium