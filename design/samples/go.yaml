schemaVersion: 1
meta:
  key: go
  name: 围棋
  players: { min: 2, max: 2 }
  durationMin: 120
  targetWeight: 4
  zone: abstract
mechanisms:
  - abstract-chess
  - pattern-building
  - area-control
components: {}
turnStructure:
  phases:
    - key: place
      name: 落子
      summary: 黑先白后，轮流在 19×19 交叉点（361 点）的空点上放一子。落子后不可移动（除非被提）。
    - key: capture
      name: 提子
      summary: 落子后若对方某块棋的"气"（相邻空点）归零，则提掉该块。先判对方提子，再判自身是否自杀（无气且未提对方则禁着）。
    - key: ko
      name: 打劫
      summary: 禁止立即回提形成全局重复（劫争）；须先在别处走一手（找劫材）对方应后才能回提。
subsystems:
  scoring:
    endTrigger: 双方连续虚着（pass）即终局；数子/数目确定胜负。
    vpSources:
      - key: area
        name: 数子法（中国规则）
        description: 得分 = 盘上存活己方子数 + 己方围住的空点。白贴 7.5 目（中国规则 area scoring，半目消除和棋）。日韩规则用数目法（围空 + 提子），贴 6.5 目。两种计分通常差 1~2 目，贴目差 largely 抵消系统偏移。
analysis:
  whyFun: 规则极简（落子、气、提、劫）却涌现极深策略。核心张力是"地"与"势"的权衡——围空是确定收益，厚势是未来影响力，高手在两者间动态取舍。完全信息但状态空间天文数字，无法算尽，靠模式识别（棋形、死活、手筋）与大局观。贴目把先手优势量化补偿，是抽象棋平衡的典范。
  remixable:
    - 厚势/先手效率——"势"是一种延迟兑现的影响力投资，可借鉴到引擎构建游戏：前期布"势"（低即时收益、高未来期权），后期兑现。
    - 气/连通块判定——一块棋的生存取决于共享 liberties，可借鉴到网络构建/区域控制：连通块共享一个"生存资源"，被切断即崩溃。
    - 贴目补偿（半目消除和棋）——先手优势的量化补偿范式，可移植到任何有先手优势的游戏；半目设计同时消除平局。
    - 劫争（禁止立即重复 + 劫材）——用"全局重复禁令 + 别处交换"打破局部僵持，可借鉴到谈判/区域控制的僵局破解。
    - 数子 vs 数目两种计分——同一游戏两套计分产生不同终局策略（数子法填己空无损、数目法填己空损目），可借鉴到"计分规则改变行为"的设计。
    - 虚着终局（双方 pass）——玩家自主决定终局时机，而非固定回合数，可借鉴到引擎构建的终局触发。
  pitfalls: 19×19 对新手过大（教学用 9×9/13×13）；数目法需判定死子与双活（seki），终局裁定复杂；贴目值随规则变化（7.5 vs 6.5），移植时须固定一套；势的价值难以量化，新手易贪地失势。
  sources:
    - title: 自身知识推理（离线，无实时检索；19×19/361 点、气/提子/劫、中国规则数子法贴 7.5 目、日韩数目法贴 6.5 目均为通行稳定规则）
  confidence: medium