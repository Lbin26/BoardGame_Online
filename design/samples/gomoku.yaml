schemaVersion: 1
meta:
  key: gomoku
  name: 五子棋
  players: { min: 2, max: 2 }
  durationMin: 20
  targetWeight: 2
  zone: abstract
mechanisms:
  - abstract-chess
  - pattern-building
components: {}
turnStructure:
  phases:
    - key: place
      name: 落子
      summary: 黑先白后，轮流在 15×15 交叉点（225 点）的空点上放一子。落子后不可移动。
    - key: win
      name: 成五判胜
      summary: 先在横/竖/斜任一方向连成不间断五子者立即获胜。自由规则下黑（先手）已被证明必胜（Allis 1993–94 威胁空间搜索 + 证明数搜索）。
subsystems:
  scoring:
    endTrigger: 任一方连成五子即立即终局判胜；棋盘下满无人成五为和（罕见）。
    vpSources:
      - key: five
        name: 连五判胜
        description: 二元胜负，无积分。竞技连珠（Renju）为中和黑必胜加入黑方禁手——双三（三三）、双四（四四）、长连（≥6 子）；白无禁手且长连算胜。成五优先于禁手（同时成五与双三则合法）。开局约束前三手 + 交换协议（Soosyrv-8/Taraguchi/Yamaguchi/Swap2）进一步平衡。
analysis:
  whyFun: 规则一句话（连五即胜）但威胁组合极深。核心是"做杀"与"防杀"的攻防——活三、冲四、双威胁的强制序列计算。先手必胜的证明让"如何平衡先手"本身成为设计课题，禁手与交换协议是 elegant 的解法。低门槛（2 人、20 分钟、无需配件）使其成为抽象棋入门典范。
  remixable:
    - 先手必胜 → 禁手平衡——当某方有结构性优势时，给优势方加"禁止动作"而非给劣势方加资源，是 elegant 的平衡范式（可借鉴到任何不对称对抗）。
    - 交换协议（Swap2/Soosyrv-8）——开局后允许换边，把"先手优势"变成可交易的选项，可借鉴到轮抽/角色选择的平衡。
    - 威胁空间搜索（强制序列）——活三→冲四→成五的强制链，可借鉴到战斗结算/进度轨的"连击"设计：一步制造下一步的必然性。
    - 长连判负（黑）vs 判胜（白）——同一图案对不同方有不同胜负语义，可借鉴到不对称胜利条件。
    - 成五优先于禁手——"达成主目标即豁免限制"的优先级规则，可借鉴到任何有约束条件的胜利判定。
  pitfalls: 自由规则黑必胜，无禁手/交换则竞技性崩塌；禁手定义递归微妙（活三须能成"非禁手的活四"），移植时须精确定义否则裁定争议；15×15 与 19×19 棋盘先手优势程度不同，须固定棋盘尺寸。
  sources:
    - title: 自身知识推理（离线，无实时检索；15×15/225 点、连五判胜、Allis 1993–94 黑必胜证明、连珠禁手三三/四四/长连、交换协议均为通行稳定知识）
  confidence: medium