<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiceGo · 大厅</title>
<link rel="stylesheet" href="assets/fonts/zcool-qingke-huangyou/index.css">
<style>
/* ============ Tokens:沿用 Checkpoint 1 已确认系统 ============ */
:root{
  --bg:#1a1a2e; --bg-2:#16213e;
  --panel:#20203a;
  --accent:#e94560;
  --accent-soft:oklch(from var(--accent) l c h / .14);
  --ink:#f2f0eb; --muted:#9aa0b4;
  --line:oklch(from var(--ink) l c h / .16);
  --radius:6px;
  --shadow-1:0 2px 8px oklch(0 0 0 / .35);
  --shadow-2:0 18px 44px -16px oklch(0 0 0 / .55);
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:'ZCOOL QingKe HuangYou','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Helvetica Neue',Helvetica,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;
}
:root[data-accent="logo"]{ --accent:#2f9fe0; --accent-2:#f5821f; }
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%) fixed;
  color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:400;line-height:1.2;text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-body)}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.ph{display:inline-grid;place-items:center;border:1px dashed var(--muted);color:var(--muted);font-size:11px;border-radius:4px;padding:1px 7px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-1)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow-1)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text]{background:oklch(from var(--bg) calc(l - .03) c h);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);padding:11px 14px;font-size:15px;font-family:var(--font-body);width:100%;transition:border-color .2s var(--ease)}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus{border-color:var(--accent);outline:none}

/* ============ Topbar(契约:logo + 用户 + 退出) ============ */
.top{border-bottom:1px solid var(--line);background:oklch(from var(--bg) l c h / .8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.top-in{display:flex;align-items:center;gap:16px;height:64px}
.top-logo{height:26px}
.top-user{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.top-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-family:var(--font-display)}

/* ============ 面包屑(契约:level>0 显示,返回大厅) ============ */
.crumb{display:flex;align-items:center;gap:14px;padding:20px 0 0;font-size:14px;color:var(--muted)}
.crumb .here{color:var(--ink)}
.crumb .sep{color:var(--line)}

/* ============ Level 0:引导带 + 分区网格 ============ */
.guide{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(24px,4vw,56px);align-items:end;padding:clamp(32px,5vw,56px) 0 clamp(24px,3vw,36px)}
.guide h1{font-size:clamp(34px,4.2vw,52px);margin-bottom:10px}
.guide .lede{color:var(--muted);font-size:16px;max-width:30em}
.guide .lede b{color:var(--ink);font-weight:600}
.fastjoin{background:oklch(from var(--panel) l c h / .7);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-1)}
.fastjoin label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:.06em}
.fastjoin .row{display:flex;gap:8px}
.fastjoin .hint{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:820px){.guide{grid-template-columns:1fr;align-items:start}}

.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:clamp(48px,6vw,80px)}
@media (max-width:980px){.zones{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.zones{grid-template-columns:1fr}}
.zone{display:flex;flex-direction:column;gap:10px;text-align:left;background:oklch(from var(--panel) l c h / .6);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;color:var(--ink);transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease)}
.zone:hover{border-color:oklch(from var(--accent) l c h / .55);transform:translateY(-3px);box-shadow:var(--shadow-2)}
.zone .seal{width:44px;height:44px;border-radius:var(--radius);display:grid;place-items:center;font-family:var(--font-display);font-size:24px;background:var(--accent-soft);color:var(--accent);border:1px solid oklch(from var(--accent) l c h / .35)}
.zone.empty-zone .seal{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.zone h3{font-size:21px}
.zone .mechs{display:flex;flex-wrap:wrap;gap:6px}
.mech{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.zone .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-top:6px}
.badge{font-size:11px;letter-spacing:.08em;padding:2px 9px;border-radius:999px}
.badge.live{background:var(--accent-soft);color:var(--accent);border:1px solid oklch(from var(--accent) l c h / .4)}
.badge.soon{color:var(--muted);border:1px dashed var(--muted)}
.zone .arrow{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease),color .25s var(--ease)}
.zone:hover .arrow{transform:translateX(4px);color:var(--accent)}

/* ============ Level 1:游戏列表 ============ */
.zone-head{display:flex;align-items:center;gap:16px;padding:clamp(28px,4vw,44px) 0 24px}
.zone-head .seal{width:52px;height:52px;border-radius:var(--radius);display:grid;place-items:center;font-family:var(--font-display);font-size:28px;background:var(--accent-soft);color:var(--accent);border:1px solid oklch(from var(--accent) l c h / .35)}
.zone-head h1{font-size:clamp(28px,3.4vw,40px)}
.zone-head .mechs{margin-top:6px}
.games{display:flex;flex-direction:column;gap:12px;padding-bottom:clamp(48px,6vw,80px)}
.game{display:flex;align-items:center;gap:18px;background:oklch(from var(--panel) l c h / .6);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;transition:border-color .25s var(--ease)}
.game.playable{cursor:pointer}
.game.playable:hover{border-color:oklch(from var(--accent) l c h / .55)}
.game.soon{opacity:.68}
.game .g-name{font-family:var(--font-display);font-size:22px;min-width:9em}
.game .g-desc{color:var(--muted);font-size:14px;flex:1}
.game .g-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.game .go{color:var(--accent);font-size:14px}
@media (max-width:700px){.game{flex-wrap:wrap}.game .g-name{min-width:0}}

/* ============ Level 2:房间层 ============ */
.room-ops{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:clamp(24px,3vw,36px) 0 16px}
@media (max-width:820px){.room-ops{grid-template-columns:1fr}}
.op{background:oklch(from var(--panel) l c h / .7);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:12px}
.op h2{font-size:22px;display:flex;align-items:center;gap:10px}
.op h2 .stepno{font-size:13px;color:var(--accent);border:1px solid oklch(from var(--accent) l c h / .4);border-radius:999px;padding:1px 10px;font-family:var(--font-body)}
.op .hint{font-size:13px;color:var(--muted)}
.op .btn-primary{width:100%;padding:14px}
.op .row{display:flex;gap:8px}
.roomlist{background:oklch(from var(--panel) l c h / .5);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:clamp(48px,6vw,80px)}
.roomlist header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.roomlist h2{font-size:20px}
.roomlist .count{font-size:12px;color:var(--muted)}
.roomlist .refresh{margin-left:auto}
.rooms{display:flex;flex-direction:column}
.room{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);transition:background .2s var(--ease)}
.room:last-child{border-bottom:none}
.room:hover{background:oklch(from var(--panel) l c h / .8)}
.room .rid{font-family:var(--font-display);font-size:19px;letter-spacing:.14em;color:var(--accent);min-width:6.5em}
.room .seats{flex:1;display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.seat{display:inline-flex;align-items:center;gap:6px}
.seat .pip{width:9px;height:9px;border-radius:50%}
.seat.red .pip{background:var(--accent)}
.seat.black .pip{background:var(--ink);opacity:.75}
.seat.open{color:var(--muted)}
.seat.open .pip{border:1px dashed var(--muted);background:transparent}
.status{font-size:11px;padding:2px 10px;border-radius:999px;letter-spacing:.06em}
.status.waiting{color:var(--accent);background:var(--accent-soft);border:1px solid oklch(from var(--accent) l c h / .4)}
.status.playing{color:var(--ink);border:1px solid var(--line)}
.status.finished{color:var(--muted);border:1px dashed var(--line)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:16px;align-items:center}
.empty .display{font-size:24px;color:var(--ink)}

/* ============ Tweaks ============ */
.tweaks{position:fixed;right:20px;bottom:20px;z-index:60;font-size:13px}
.tweaks-toggle{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px;box-shadow:var(--shadow-1)}
.tweaks-panel{display:none;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;width:240px;box-shadow:var(--shadow-2)}
.tweaks.open .tweaks-panel{display:block}
.tweaks-panel h4{font-size:12px;letter-spacing:.2em;color:var(--muted);margin-bottom:12px;font-weight:600}
.tweak-row{margin-bottom:12px}
.tweak-row label{display:block;color:var(--muted);margin-bottom:6px;font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{flex:1;background:transparent;border:none;color:var(--muted);padding:6px 4px;cursor:pointer;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tweaks .ver{color:var(--muted);font-size:11px;margin-top:4px}
</style>
</head>
<body>

<div class="top">
  <div class="wrap top-in">
    <img class="top-logo" src="assets/dicego-brand/logo-wordmark.png" alt="DiceGo">
    <div class="top-user">
      <span class="avatar">演</span><span>演示玩家 <span class="ph">[登录态接 store]</span></span>
      <button class="btn btn-ghost btn-sm">退出登录</button>
    </div>
  </div>
</div>

<div class="wrap">
  <nav class="crumb" id="crumb" hidden>
    <a class="btn btn-ghost btn-sm" href="?">← 返回大厅</a>
    <span id="crumbZone"></span>
    <span class="sep" id="crumbSep" hidden>/</span>
    <span class="here" id="crumbGame"></span>
  </nav>

  <!-- Level 0 -->
  <div id="lv0">
    <div class="guide">
      <div>
        <h1>选一张棋桌,坐下。</h1>
        <p class="lede">有房间号?<b>右侧直接入场</b>。想逛逛?下面七个分区按玩法机制划分——挑一个合你口味的,进去看棋种。</p>
      </div>
      <form class="fastjoin" onsubmit="return false">
        <label for="jj0">房间号快速入场</label>
        <div class="row">
          <input type="text" id="jj0" maxlength="10" placeholder="房间号(如 ABC123)">
          <button class="btn btn-primary" disabled>加入</button>
        </div>
        <p class="hint">从朋友那里拿到房间号,输入即可快速入场</p>
      </form>
    </div>
    <div class="zones" id="zones"></div>
  </div>

  <!-- Level 1 -->
  <div id="lv1" hidden>
    <div class="zone-head">
      <span class="seal" id="z1seal"></span>
      <div>
        <h1 id="z1name"></h1>
        <div class="mechs" id="z1mechs"></div>
      </div>
    </div>
    <div class="games" id="games"></div>
  </div>

  <!-- Level 2 -->
  <div id="lv2" hidden>
    <div class="room-ops">
      <div class="op">
        <h2><span class="stepno">开局</span>创建房间</h2>
        <button class="btn btn-primary">创建房间</button>
        <p class="hint">创建房间后进入房间选择红方/黑方座位,双方落座即开战</p>
      </div>
      <form class="op" onsubmit="return false">
        <h2><span class="stepno">赴约</span>输入房间号加入</h2>
        <div class="row">
          <input type="text" id="jj2" maxlength="10" placeholder="房间号(如 ABC123)">
          <button class="btn btn-primary" disabled>加入</button>
        </div>
        <p class="hint">从朋友那里拿到房间号,输入即可快速入场</p>
      </form>
    </div>
    <div class="roomlist">
      <header>
        <h2>房间列表</h2>
        <span class="count" id="rcount"></span>
        <span class="ph">演示数据</span>
        <button class="btn btn-ghost btn-sm refresh">刷新</button>
      </header>
      <div class="rooms" id="rooms"></div>
      <div class="empty" id="roomsEmpty" hidden>
        <span class="display">暂无房间,创建一个吧!</span>
        <button class="btn btn-primary">创建房间</button>
      </div>
    </div>
  </div>
</div>

<div class="tweaks" id="tweaks">
  <div class="tweaks-panel">
    <h4>TWEAKS</h4>
    <div class="tweak-row">
      <label>Accent</label>
      <div class="seg" data-key="accent">
        <button aria-pressed="true" data-val="brand">品牌红</button>
        <button aria-pressed="false" data-val="logo">字标蓝橙</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>房间列表状态(演示)</label>
      <div class="seg" data-key="rooms">
        <button aria-pressed="true" data-val="demo">有房间</button>
        <button aria-pressed="false" data-val="empty">空状态</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>层级(模拟 URL query)</label>
      <div class="seg" data-key="level">
        <button aria-pressed="true" data-val="auto">跟 URL</button>
        <button aria-pressed="false" data-val="0">0</button>
        <button aria-pressed="false" data-val="1">1</button>
        <button aria-pressed="false" data-val="2">2</button>
      </div>
    </div>
    <div class="ver">v0 草稿 · 导航契约与真实 lobby 一致</div>
  </div>
  <button class="tweaks-toggle" aria-expanded="false">Tweaks</button>
</div>

<script>
/* 目录数据:原文照录 boardgame-ui/src/constants/catalog.ts(2026-11-20) */
var ZONES = [
  { key:'party', name:'轻策/派对区', seal:'派', mechanisms:['同时行动','反应','猜词','吹牛','轮抽轻量版'] },
  { key:'family', name:'家庭/聚会区', seal:'家', mechanisms:['成套收集','板块放置','骰子轻策','交易谈判'] },
  { key:'strategy', name:'策略核心区', seal:'策', mechanisms:['工人放置','引擎构建','区域控制','路线构建','行动点分配'] },
  { key:'card', name:'卡牌区', seal:'牌', mechanisms:['手牌管理','牌库构建','卡牌驱动','轮抽','多用途卡牌'] },
  { key:'narrative', name:'美式/叙事区', seal:'叙', mechanisms:['合作','传承','叙事','隐藏身份','战斗结算'] },
  { key:'abstract', name:'抽象/双人区', seal:'棋', mechanisms:['抽象棋','模式构建','逻辑推理'] },
  { key:'heavy', name:'硬核/重策区', seal:'重', mechanisms:['资源管理+引擎+路线+推轨的复合体'] }
];
var GAMES = [
  { key:'xiangqi', name:'象棋', zone:'abstract', playable:true, desc:'楚河汉界,运筹帷幄', players:2 },
  { key:'go', name:'围棋', zone:'abstract', playable:false, desc:'敬请期待' },
  { key:'gomoku', name:'五子棋', zone:'abstract', playable:false, desc:'敬请期待' },
  { key:'splendor', name:'璀璨宝石 Splendor', zone:'card', playable:false, desc:'敬请期待', mechanisms:['引擎构建','成套收集'] },
  { key:'diceThrone', name:'王权骰铸 Dice Throne', zone:'narrative', playable:false, desc:'敬请期待', mechanisms:['骰子驱动','角色能力(不对称)','卡牌辅助'] },
  { key:'avalon', name:'阿瓦隆 Avalon', zone:'narrative', playable:false, desc:'敬请期待', mechanisms:['隐藏身份','推理/演绎','投票'] },
  { key:'brass', name:'伯明翰 Brass: Birmingham', zone:'heavy', playable:false, desc:'敬请期待', mechanisms:['网络构建','经济/资源管理','手牌管理(轻卡驱)'] }
];
/* 演示房间(非真实数据,页面已标「演示数据」) */
var DEMO_ROOMS = [
  { roomId:'K7Q2', red:'演示玩家甲', black:null, status:'waiting' },
  { roomId:'M3X8', red:'演示玩家乙', black:'演示玩家丙', status:'playing' },
  { roomId:'T9D4', red:'演示玩家丁', black:'演示玩家戊', status:'finished' }
];
function gamesInZone(k){ return GAMES.filter(function(g){ return g.zone === k; }); }
/* 契约:resolveLevel —— 可玩且归属匹配才进房间层 */
function resolveLevel(q){
  var zone = ZONES.find(function(z){ return z.key === q.zone; });
  var game = GAMES.find(function(g){ return g.key === q.game; });
  if (zone && game && game.zone === zone.key && game.playable) return { level:2, zone:zone, game:game };
  if (zone) return { level:1, zone:zone };
  return { level:0 };
}
function el(id){ return document.getElementById(id); }
function mechChips(list, max){
  return list.slice(0, max || 3).map(function(m){ return '<span class="mech">' + m + '</span>'; }).join('');
}
function renderZones(){
  el('zones').innerHTML = ZONES.map(function(z){
    var gs = gamesInZone(z.key);
    var live = gs.filter(function(g){ return g.playable; }).length;
    var badge = live > 0
      ? '<span class="badge live">' + live + ' 款可玩</span>'
      : (gs.length ? '<span class="badge soon">敬请期待</span>' : '<span class="badge soon">规划中</span>');
    return '<a class="zone' + (gs.length ? '' : ' empty-zone') + '" href="?zone=' + z.key + '">' +
      '<span class="seal">' + z.seal + '</span>' +
      '<h3>' + z.name + '</h3>' +
      '<span class="mechs">' + mechChips(z.mechanisms) + '</span>' +
      '<span class="foot">' + (gs.length ? gs.length + ' 款棋种' : '暂无棋种') + badge + '<span class="arrow">→</span></span>' +
      '</a>';
  }).join('');
}
function renderLevel1(nav){
  el('z1seal').textContent = nav.zone.seal;
  el('z1name').textContent = nav.zone.name;
  el('z1mechs').innerHTML = mechChips(nav.zone.mechanisms, 5);
  var gs = gamesInZone(nav.zone.key);
  el('games').innerHTML = gs.length ? gs.map(function(g){
    return '<' + (g.playable ? 'a href="?zone=' + nav.zone.key + '&game=' + g.key + '"' : 'div') +
      ' class="game ' + (g.playable ? 'playable' : 'soon') + '">' +
      '<span class="g-name">' + g.name + '</span>' +
      '<span class="g-desc">' + g.desc + (g.mechanisms ? ' · ' + g.mechanisms.join(' / ') : '') + '</span>' +
      '<span class="g-meta">' + (g.players ? g.players + ' 人' : '') +
      (g.playable ? '<span class="badge live">可玩</span><span class="go">进入房间层 →</span>' : '<span class="badge soon">敬请期待</span>') +
      '</span></' + (g.playable ? 'a' : 'div') + '>';
  }).join('') :
  '<div class="empty"><span class="display">这个分区还没有登记棋种</span><span>机制方向:' + nav.zone.mechanisms.join(' / ') + '</span><a class="btn btn-ghost btn-sm" href="?">返回大厅</a></div>';
}
function renderLevel2(nav, emptyDemo){
  var rooms = emptyDemo ? [] : DEMO_ROOMS;
  var waiting = rooms.filter(function(r){ return r.status === 'waiting'; }).length;
  var playing = rooms.filter(function(r){ return r.status === 'playing'; }).length;
  el('rcount').textContent = '(共 ' + rooms.length + ' 个 · 等待 ' + waiting + ' · 对局 ' + playing + ')';
  el('roomsEmpty').hidden = rooms.length > 0;
  el('rooms').hidden = rooms.length === 0;
  el('rooms').innerHTML = rooms.map(function(r){
    var st = { waiting:'等待中', playing:'对局中', finished:'已结束' }[r.status];
    var act = r.status === 'waiting'
      ? '<button class="btn btn-primary btn-sm">加入</button>'
      : '<button class="btn btn-ghost btn-sm">观战</button>';
    return '<div class="room">' +
      '<span class="rid">' + r.roomId + '</span>' +
      '<span class="seats">' +
        '<span class="seat red"><span class="pip"></span>' + (r.red || '空位') + '</span>' +
        (r.black ? '<span class="seat black"><span class="pip"></span>' + r.black + '</span>' : '<span class="seat open"><span class="pip"></span>空位</span>') +
      '</span>' +
      '<span class="status ' + r.status + '">' + st + '</span>' + act +
      '</div>';
  }).join('');
}
/* 房间号输入:非空才启用加入(契约) */
['jj0','jj2'].forEach(function(id){
  var input = el(id);
  input.addEventListener('input', function(){
    input.parentElement.querySelector('button').disabled = !input.value.trim();
  });
});
/* Tweaks */
var tweakState = { accent:'brand', rooms:'demo', level:'auto' };
(function(){
  var box = el('tweaks');
  var toggle = box.querySelector('.tweaks-toggle');
  toggle.addEventListener('click', function(){
    var open = box.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
  });
  box.querySelectorAll('.seg').forEach(function(seg){
    var key = seg.dataset.key;
    seg.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        tweakState[key] = btn.dataset.val;
        seg.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b === btn); });
        if (key === 'accent') document.documentElement.dataset.accent = btn.dataset.val;
        route();
      });
    });
  });
})();
function route(){
  var q = {};
  location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function(_, k, v){ q[k] = decodeURIComponent(v); });
  var nav = resolveLevel(q);
  var level = tweakState.level === 'auto' ? nav.level : +tweakState.level;
  if (level === 1 && !nav.zone) nav = { level:1, zone:ZONES[5] };
  if (level === 2 && !nav.game) nav = { level:2, zone:ZONES[5], game:GAMES[0] };
  el('lv0').hidden = level !== 0;
  el('lv1').hidden = level !== 1;
  el('lv2').hidden = level !== 2;
  el('crumb').hidden = level === 0;
  if (level > 0){
    el('crumbZone').textContent = nav.zone.name;
    el('crumbSep').hidden = level !== 2;
    el('crumbGame').textContent = level === 2 ? nav.game.name : '';
  }
  if (level === 0) renderZones();
  if (level === 1) renderLevel1(nav);
  if (level === 2) renderLevel2(nav, tweakState.rooms === 'empty');
}
route();
</script>
