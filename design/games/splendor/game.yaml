turnStructure:
  phases:
    - key: chooseAction
      name: 执行一个行动（四选一）
      summary: 拿 3 枚异色宝石；或拿 2 枚同色宝石（该色供给 ≥4）；或预留 1 张发展卡并拿 1 枚黄金（有则拿）；或购买 1 张面朝上或自己预留的发展卡（支付费用减去永久加成，黄金补差）。
    - key: nobleVisit
      name: 贵族拜访
      summary: 若发展卡加成满足某贵族需求（两色各 4 或三色各 3），该贵族拜访并归其所有（+3 VP）。不耗行动，每回合至多 1 位贵族拜访；可满足多位时任选其一。
    - key: discard
      name: 整理手牌
      summary: 回合末宝石（含黄金）超过 10 枚须弃至 10 枚（本回合拿的优先保留，弃哪些自选）。
subsystems:
  scoring:
    endTrigger: 任一玩家达到 15 VP 触发终局，当前轮回合全部完成后结算；最高 VP 者胜，平局时发展卡（已购）数量少者胜。
    vpSources:
      - key: cards
        name: 发展卡 VP
        description: 每张发展卡 0~5 VP（一级 0~1、二级 1~3、三级 3~5）。
      - key: nobles
        name: 贵族 VP
        description: 每位贵族 3 VP，加成达标自动拜访获得。
analysis:
  whyFun: 极简行动（四选一）下的引擎竞速。买卡获得永久加成（购买折扣）+VP，前期投资引擎、后期加速兑现；五色宝石的供给约束与贵族成套收集制造玩家互动（抢卡、卡色、囤色）；15 VP 达标触发终局压缩滚雪球，落后者保有追赶窗口。
  remixable:
    - 永久加成折扣引擎——买卡降低后续购买成本，可移植到任何引擎构建玩法。
    - 三级卡费用/VP 递增——低费垫引擎、高费兑 VP 的科技树节奏。
    - 贵族成套收集（达标即得、不耗行动）——被动成套奖励的标杆设计。
    - 预留 + 黄金万能——隐藏意图 + 灵活补差的资源博弈。
    - 15 VP 达标终局——目标触发式终局抑制滚雪球。
    - 手牌上限 10——库存压力迫使消费。
  pitfalls: 本档案 cost/gain 为真实规则数值，可直接作对局数据源；唯贵族卡 cost 字段语义为「所需发展卡加成数」而非宝石费用，导出 DB 种子与引擎建模时须区分。宝石供给随人数变化（2 人 4/色、3 人 5/色、4 人 7/色），supply 字段记录的是 4 人局值。
  sources:
    - title: daniman/splendor-server（start-state-cards.json，90 卡 + 银行供给）
      url: https://github.com/daniman/splendor-server
    - title: dsmiller95/SplendorSimulator（cards.csv，100 行卡+贵族）
      url: https://github.com/dsmiller95/SplendorSimulator
    - title: BreckEmert/Splendor-AI（splendor_cards_data.py，100 条卡+贵族）
      url: https://github.com/BreckEmert/Splendor-AI
    - title: eitanf/grandeur（card.h + noble.h，C++ 完整实现）
