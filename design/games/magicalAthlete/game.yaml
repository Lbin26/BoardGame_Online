# 胡闹运动会（Magical Athlete / 魔法运动员）真实规则数据集
# 版本：CMYK 基础盒 2026-08-28 修订（ruleset: cmyk-base-2026-08-28）
# 数值单一事实来源：赛道 0-30、四场奖牌 [3,1]/[4,2]/[4,2]/[5,3]、36 名选手
# 来源核对记录见 journal.md；扩展字段（board/racerAbilities/trophies/variants）不属于
# tools/boardgame-design 的 GameDocSchema，校验会忽略，但实现引擎必须消费这些字段。
schemaVersion: 1
meta:
  key: magicalAthlete
  name: 胡闹运动会（Magical Athlete）
  players: { min: 2, max: 6 }
  durationMin: 30
  targetWeight: 1.2
  zone: party
mechanisms:
  - drafting
  - dice-driven
  - variable-player-powers
  - light-dice-strategy
components:
  resources:
    - { key: gold, name: 第一名金牌, supply: 4 }
    - { key: silver, name: 第二名银牌, supply: 4 }
    - { key: bronze1, name: 1 分铜币, supply: 16 }
    - { key: bronze3, name: 3 分铜币, supply: 9 }
  dice:
    - { key: d6, name: 六面骰, faces: [1, 2, 3, 4, 5, 6], count: 6 }
  decks:
    - key: racer
      name: 选手卡（36 名，每名唯一）
      cards:
        - { key: alchemist, name: 炼金术士, count: 1 }
        - { key: baba_yaga, name: 鸡脚屋, count: 1 }
        - { key: banana, name: 香蕉, count: 1 }
        - { key: blimp, name: 飞艇, count: 1 }
        - { key: centaur, name: 半人马, count: 1 }
        - { key: cheerleader, name: 啦啦队长, count: 1 }
        - { key: coach, name: 教练, count: 1 }
        - { key: copycat, name: 模仿猫, count: 1 }
        - { key: dicemonger, name: 骰子商人, count: 1 }
        - { key: duelist, name: 决斗家, count: 1 }
        - { key: egg, name: 蛋蛋, count: 1 }
        - { key: flip_flop, name: 人字拖, count: 1 }
        - { key: genius, name: 天才, count: 1 }
        - { key: gunk, name: 黏液怪, count: 1 }
        - { key: hare, name: 野兔, count: 1 }
